<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello</title>
<style>
:root{--bg:#f6f7fb;--ink:#14182b;--muted:#5a6078;--accent:#3350a0}
@media (prefers-color-scheme:dark){:root{--bg:#10131f;--ink:#e8eaf4;--muted:#9aa0b8;--accent:#8ea6ff}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,system-ui,sans-serif}
main{text-align:center;padding:24px}h1{margin:0 0 8px;font-size:2.4rem}p{color:var(--muted);margin:0 0 20px}
button{font:inherit;padding:10px 18px;border-radius:8px;border:0;background:var(--accent);color:#fff;cursor:pointer}
</style></head><body><main>
<h1>Hello from a native window</h1>
<p>This page is running inside a WKWebView, packaged as a macOS app by html2mac.</p>
<button id="b">Clicked 0 times</button>
<p id="saved"></p>
</main>
<script>
let n=0;try{n=+localStorage.getItem('n')||0}catch(e){}
const b=document.getElementById('b'),show=()=>b.textContent=`Clicked ${n} time${n===1?'':'s'}`;show();
b.onclick=()=>{n++;try{localStorage.setItem('n',n)}catch(e){}show()};
document.getElementById('saved').textContent='The count persists between launches (localStorage).';
</script></body></html>
